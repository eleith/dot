# ==============================================================================
# COLORSCHEME: Modus Vivendi Tinted
# ==============================================================================

# Global theme variables referenced by status-left / status-right / window formats
set -g @theme_bg "#1d2235"
set -g @theme_fg "#ffffff"
set -g @theme_status_bg "#989898"
set -g @theme_status_fg "#0d0e1c"
set -g @theme_info_bg "#4a4f69"
set -g @theme_info_fg "#ffffff"
set -g @theme_window_bg "#79a8ff"
set -g @theme_window_fg "#0d0e1c"
set -g @theme_window_info_bg "#2b3045"
set -g @theme_window_info_fg "#989898"

# Explicit pane background so tmux answers OSC 11 with Modus Vivendi Tinted
set -g window-style "bg=#0d0e1c,fg=#ffffff"
set -g window-active-style "bg=#0d0e1c,fg=#ffffff"

# Default statusbar base styling
set-option -g status-style "bg=#1d2235,fg=#ffffff"

# Window title styles
set-window-option -g window-status-style "bg=#2b3045,fg=#989898"
set-window-option -g window-status-activity-style "bg=#1d2235,fg=#fec43f"
set-window-option -g window-status-current-style "bg=#79a8ff,fg=#0d0e1c"

# Pane borders
set-option -g pane-active-border-style "fg=#79a8ff"
set-option -g pane-border-style "fg=#61647a"

# Command line / messages
set-option -g message-style "bg=#4a4f69,fg=#ffffff"
set-option -g message-command-style "bg=#4a4f69,fg=#ffffff"

# Pane number display
set-option -g display-panes-active-colour "#79a8ff"
set-option -g display-panes-colour "#61647a"

# Clock
set-window-option -g clock-mode-colour "#2fafff"

# Bell
set-window-option -g window-status-bell-style "bg=#ff5f5f,fg=#0d0e1c"
