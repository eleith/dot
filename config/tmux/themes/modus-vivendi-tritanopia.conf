# ==============================================================================
# COLORSCHEME: Modus Vivendi Tritanopia
# ==============================================================================

# Global theme variables referenced by status-left / status-right / window formats
set -g @theme_bg "#1e1e1e"
set -g @theme_fg "#ffffff"
set -g @theme_status_bg "#989898"
set -g @theme_status_fg "#000000"
set -g @theme_info_bg "#535353"
set -g @theme_info_fg "#ffffff"
set -g @theme_window_bg "#79a8ff"
set -g @theme_window_fg "#000000"
set -g @theme_window_info_bg "#303030"
set -g @theme_window_info_fg "#989898"

# Explicit pane background so tmux answers OSC 11 with Modus Vivendi Tritanopia
set -g window-style "bg=#000000,fg=#ffffff"
set -g window-active-style "bg=#000000,fg=#ffffff"

# Default statusbar base styling
set-option -g status-style "bg=#1e1e1e,fg=#ffffff"

# Window title styles
set-window-option -g window-status-style "bg=#303030,fg=#989898"
set-window-option -g window-status-activity-style "bg=#1e1e1e,fg=#ffa00f"
set-window-option -g window-status-current-style "bg=#79a8ff,fg=#000000"

# Pane borders
set-option -g pane-active-border-style "fg=#79a8ff"
set-option -g pane-border-style "fg=#646464"

# Command line / messages
set-option -g message-style "bg=#535353,fg=#ffffff"
set-option -g message-command-style "bg=#535353,fg=#ffffff"

# Pane number display
set-option -g display-panes-active-colour "#79a8ff"
set-option -g display-panes-colour "#646464"

# Clock
set-window-option -g clock-mode-colour "#2fafff"

# Bell
set-window-option -g window-status-bell-style "bg=#ff5f5f,fg=#000000"
