# ==============================================================================
# COLORSCHEME: Modus Operandi
# ==============================================================================

# Global theme variables referenced by status-left / status-right / window formats
set -g @theme_bg "#f2f2f2"
set -g @theme_fg "#000000"
set -g @theme_status_bg "#595959"
set -g @theme_status_fg "#ffffff"
set -g @theme_info_bg "#c4c4c4"
set -g @theme_info_fg "#000000"
set -g @theme_window_bg "#3548cf"
set -g @theme_window_fg "#ffffff"
set -g @theme_window_info_bg "#e0e0e0"
set -g @theme_window_info_fg "#595959"

# Explicit pane background so tmux answers OSC 11 with Modus Operandi
set -g window-style "bg=#ffffff,fg=#000000"
set -g window-active-style "bg=#ffffff,fg=#000000"

# Default statusbar base styling
set-option -g status-style "bg=#f2f2f2,fg=#000000"

# Window title styles
set-window-option -g window-status-style "bg=#e0e0e0,fg=#595959"
set-window-option -g window-status-activity-style "bg=#f2f2f2,fg=#884900"
set-window-option -g window-status-current-style "bg=#3548cf,fg=#ffffff"

# Pane borders
set-option -g pane-active-border-style "fg=#3548cf"
set-option -g pane-border-style "fg=#9f9f9f"

# Command line / messages
set-option -g message-style "bg=#c4c4c4,fg=#000000"
set-option -g message-command-style "bg=#c4c4c4,fg=#000000"

# Pane number display
set-option -g display-panes-active-colour "#3548cf"
set-option -g display-panes-colour "#9f9f9f"

# Clock
set-window-option -g clock-mode-colour "#0031a9"

# Bell
set-window-option -g window-status-bell-style "bg=#d00000,fg=#ffffff"
