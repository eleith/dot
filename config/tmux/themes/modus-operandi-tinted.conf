# ==============================================================================
# COLORSCHEME: Modus Operandi Tinted
# ==============================================================================

# Global theme variables referenced by status-left / status-right / window formats
set -g @theme_bg "#efe9dd"
set -g @theme_fg "#000000"
set -g @theme_status_bg "#595959"
set -g @theme_status_fg "#fbf7f0"
set -g @theme_info_bg "#c9b9b0"
set -g @theme_info_fg "#000000"
set -g @theme_window_bg "#3546c2"
set -g @theme_window_fg "#fbf7f0"
set -g @theme_window_info_bg "#dfd5cf"
set -g @theme_window_info_fg "#595959"

# Explicit pane background so tmux answers OSC 11 with Modus Operandi Tinted
set -g window-style "bg=#fbf7f0,fg=#000000"
set -g window-active-style "bg=#fbf7f0,fg=#000000"

# Default statusbar base styling
set-option -g status-style "bg=#efe9dd,fg=#000000"

# Window title styles
set-window-option -g window-status-style "bg=#dfd5cf,fg=#595959"
set-window-option -g window-status-activity-style "bg=#efe9dd,fg=#894000"
set-window-option -g window-status-current-style "bg=#3546c2,fg=#fbf7f0"

# Pane borders
set-option -g pane-active-border-style "fg=#3546c2"
set-option -g pane-border-style "fg=#9f9690"

# Command line / messages
set-option -g message-style "bg=#c9b9b0,fg=#000000"
set-option -g message-command-style "bg=#c9b9b0,fg=#000000"

# Pane number display
set-option -g display-panes-active-colour "#3546c2"
set-option -g display-panes-colour "#9f9690"

# Clock
set-window-option -g clock-mode-colour "#0031a9"

# Bell
set-window-option -g window-status-bell-style "bg=#d00000,fg=#fbf7f0"
