# ==============================================================================
# COLORSCHEME: Gruvbox Light (Medium)
# ==============================================================================

# Global theme variables referenced by status-left / status-right / window formats
set -g @theme_bg "#ebdbb2"              # bg1
set -g @theme_fg "#3c3836"              # fg1
set -g @theme_status_bg "#665c54"       # fg3
set -g @theme_status_fg "#fbf1c7"       # bg0
set -g @theme_info_bg "#d5c4a1"         # bg2
set -g @theme_info_fg "#3c3836"         # fg1
set -g @theme_window_bg "#d79921"       # yellow
set -g @theme_window_fg "#fbf1c7"       # bg0
set -g @theme_window_info_bg "#d5c4a1"  # bg2
set -g @theme_window_info_fg "#7c6f64"  # fg4

# Explicit pane background so tmux answers OSC 11 with Gruvbox Light
set -g window-style "bg=#fbf1c7,fg=#3c3836"
set -g window-active-style "bg=#fbf1c7,fg=#3c3836"

# Default statusbar base styling
set-option -g status-style "bg=#ebdbb2,fg=#3c3836"

# Window title styles
set-window-option -g window-status-style "bg=colour66,fg=colour229"
set-window-option -g window-status-activity-style "bg=colour237,fg=colour241"
set-window-option -g window-status-current-style "bg=default,fg=colour237"

# Pane borders
set-option -g pane-active-border-style "fg=colour241"
set-option -g pane-border-style "fg=colour252"

# Command line / messages
set-option -g message-style "bg=colour252,fg=colour241"
set-option -g message-command-style "bg=colour124,fg=colour241"

# Pane number display
set-option -g display-panes-active-colour "colour241"
set-option -g display-panes-colour "colour248"

# Clock
set-window-option -g clock-mode-colour "colour172"

# Bell
set-window-option -g window-status-bell-style "bg=colour124,fg=colour229"
