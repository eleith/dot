# ==============================================================================
# COLORSCHEME: Gruvbox Dark (Medium)
# ==============================================================================

# Global theme variables referenced by status-left / status-right / window formats
set -g @theme_bg "#3c3836"              # bg1
set -g @theme_fg "#ebdbb2"              # fg1
set -g @theme_status_bg "#bdae93"       # fg3
set -g @theme_status_fg "#282828"       # bg0
set -g @theme_info_bg "#504945"         # bg2
set -g @theme_info_fg "#ebdbb2"         # fg1
set -g @theme_window_bg "#fabd2f"       # yellow
set -g @theme_window_fg "#282828"       # bg0
set -g @theme_window_info_bg "#504945"  # bg2
set -g @theme_window_info_fg "#a89984"  # fg4

# Explicit pane background so tmux answers OSC 11 with Gruvbox Dark
set -g window-style "bg=#282828,fg=#ebdbb2"
set -g window-active-style "bg=#282828,fg=#ebdbb2"

# Default statusbar base styling
set-option -g status-style "bg=#3c3836,fg=#ebdbb2"

# Window title styles
set-window-option -g window-status-style "bg=colour214,fg=colour237"
set-window-option -g window-status-activity-style "bg=colour237,fg=colour248"
set-window-option -g window-status-current-style "bg=red,fg=colour237"

# Pane borders
set-option -g pane-active-border-style "fg=colour250"
set-option -g pane-border-style "fg=colour237"

# Command line / messages
set-option -g message-style "bg=colour239,fg=colour223"
set-option -g message-command-style "bg=colour239,fg=colour223"

# Pane number display
set-option -g display-panes-active-colour "colour250"
set-option -g display-panes-colour "colour237"

# Clock
set-window-option -g clock-mode-colour "colour109"

# Bell
set-window-option -g window-status-bell-style "bg=colour167,fg=colour235"
